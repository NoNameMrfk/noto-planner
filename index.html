<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>noto. Planner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="mode-planner">
  <!-- Theme atmospheric backgrounds -->
  <canvas id="spaceCanvas" aria-hidden="true"></canvas>
  <div class="theme-bg classic" id="themeBg">
    <!-- Classic leaves -->
    <img src="leaf.png" alt="" class="float-img leaf" />
    <img src="leaf.png" alt="" class="float-img leaf" />
    <img src="leaf.png" alt="" class="float-img leaf" />
    <img src="leaf.png" alt="" class="float-img leaf" />
    <img src="leaf.png" alt="" class="float-img leaf" />

    <!-- Ocean waves -->
    <div class="wave"></div>
    <div class="wave w2"></div>
    <div class="wave w3"></div>

    <!-- Beehive large hexagons -->
    <div class="hex-layer">
      <div class="hex"></div>
      <div class="hex"></div>
      <div class="hex"></div>
      <div class="hex"></div>
      <div class="hex"></div>
    </div>

    <!-- Rose petals -->
    <img src="petal.png" alt="" class="float-img petal" />
    <img src="petal.png" alt="" class="float-img petal" />
    <img src="petal.png" alt="" class="float-img petal" />
    <img src="petal.png" alt="" class="float-img petal" />
    <img src="petal.png" alt="" class="float-img petal" />

    <!-- Midnight moon + stars -->
    <img src="moon.png" alt="" class="moon-img" />
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
  </div>

  <canvas id="particleCanvas"></canvas>
  <div id="customCursor" aria-hidden="true">
    <div class="cursor-dot"></div>
    <div class="cursor-ring"></div>
  </div>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">✦</div>
        <div>
          <h1>のと。 Planner</h1>
          <p id="brandTagline">Your life, in one place.</p>
        </div>
      </div>

      <div class="mode-switch">
        <button type="button" data-mode="planner" class="active" id="modePlanner">Planner</button>
        <button type="button" data-mode="study" id="modeStudy">Study</button>
      </div>

      <nav class="nav">
        <button class="active planner-only" data-view="today" data-modes="planner">
          <span class="nav-icon">⌂</span><span>Today</span>
        </button>
        <button class="planner-only" data-view="calendar" data-modes="planner">
          <span class="nav-icon">▦</span><span>Calendar</span>
        </button>
        <button data-view="todos" data-modes="planner study">
          <span class="nav-icon">✓</span><span>Tasks</span>
        </button>
        <button data-view="notes" data-modes="planner study">
          <span class="nav-icon">✎</span><span>Notes</span>
        </button>

        <button class="study-only" data-view="focus" data-modes="study">
          <span class="nav-icon">◎</span><span>Focus</span>
        </button>

        <button data-view="progress" data-modes="planner study">
          <span class="nav-icon">▣</span><span>Progress</span>
        </button>
        <button data-view="settings" data-modes="planner study">
          <span class="nav-icon">⚙</span><span>Settings</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <span id="progressLabel">0% of tasks completed</span>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="theme-picker">
          <span class="theme-picker-label">Theme</span>
          <div class="theme-options">
            <button type="button" class="theme-swatch theme-classic" data-theme="classic" title="Noto — warm ivory & forest" aria-label="Noto palette">
              <span class="theme-swatch-preview"></span>
            </button>
            <button type="button" class="theme-swatch theme-ember" data-theme="ember" title="Ember — warm ivory & burnt orange" aria-label="Ember palette">
              <span class="theme-swatch-preview"></span>
            </button>
            <button type="button" class="theme-swatch theme-white" data-theme="white" title="White — pure monochrome" aria-label="White palette">
              <span class="theme-swatch-preview"></span>
            </button>
            <button type="button" class="theme-swatch theme-rose" data-theme="rose" title="Rose — blush & burgundy" aria-label="Rose palette">
              <span class="theme-swatch-preview"></span>
            </button>
            <button type="button" class="theme-swatch theme-cobalt" data-theme="cobalt" title="Cobalt — off-white & deep blue" aria-label="Cobalt palette">
              <span class="theme-swatch-preview"></span>
            </button>
            <button type="button" class="theme-swatch theme-midnight" data-theme="midnight" title="Midnight — deep navy" aria-label="Midnight palette">
              <span class="theme-swatch-preview"></span>
            </button>
            <button type="button" class="theme-swatch theme-forest" data-theme="forest" title="Forest — deep moss" aria-label="Forest palette">
              <span class="theme-swatch-preview"></span>
            </button>
            <button type="button" class="theme-swatch theme-black" data-theme="black" title="Black — true monochrome" aria-label="Black palette">
              <span class="theme-swatch-preview"></span>
            </button>
            <button type="button" class="theme-swatch theme-vermilion" data-theme="vermilion" title="Vermilion — ivory & restrained red" aria-label="Vermilion palette">
              <span class="theme-swatch-preview"></span>
            </button>
          </div>
        </div>
        <span>Everything saves automatically.</span>
      </div>
    </aside>

    <main>
      <div class="mobile-topbar" id="mobileTopbar">
        <div class="mobile-topbar-brand">
          <strong>noto.</strong>
          <span id="mobileModeLabel">Planner</span>
        </div>
        <div class="mobile-topbar-actions">
          <div class="mobile-mode-pill" role="group" aria-label="Mode">
            <button type="button" data-mode="planner" id="mobileModePlanner" class="active">Plan</button>
            <button type="button" data-mode="study" id="mobileModeStudy">Study</button>
          </div>
          <button type="button" class="mobile-icon-btn" id="mobileSearchBtn" aria-label="Search">⌕</button>
        </div>
      </div>
      <h2 class="mobile-page-title" id="mobilePageTitle" hidden></h2>
      <header class="topbar" id="mainTopbar">
        <div>
          <p class="eyebrow" id="topEyebrow">Personal command center</p>
          <h2 id="pageTitle">Good morning.</h2>
        </div>
        <div class="header-search">
          <button type="button" class="header-search-btn" id="headerSearchBtn" aria-label="Search">
            <span class="header-search-icon">⌕</span>
            <span>Search…</span>
            <kbd>⌘K</kbd>
          </button>
        </div>
        <div class="top-actions">
          <div class="date-pill" id="todayLabel"></div>
          <button class="secondary-button" id="miniNotoBtn">◉ Mini noto.</button>
          <button class="primary-button" id="quickAddButton">+ Quick Add</button>
        </div>
      </header>

      <!-- NOTE: remaining body content preserved from original - this is a partial update placeholder -->
      <p style="padding:40px;color:red">ERROR: partial upload - do not use</p>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
